<!DOCTYPE html>
<html lang="en" class="antialiased light">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>GSCA AI</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=GSCA+AI&background=0ea5e9&color=fff&size=192">
    
    <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiR1NDQSBBSSIsInNob3J0X25hbWUiOiJHU0NBIEFJIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiI2ZmZmZmZiIsInRoZW1lX2NvbG9yIjoiIzBlYTVlOSIsImljb25zIjpbeyJzcmMiOiJodHRwczovL3VpLWF2YXRhcnMuY29tL2FwaS8/bmFtZT1HU0NBK0FJJmJhY2tncm91bmQ9MGVhNWU5JmNvbG9yPWZmZiZzaXplPTE5MiIsInR5cGVzIjoiaW1hZ2UvcG5nIiwic2l6ZXMiOiIxOTJ4MTkyIn1dfQ==">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0ea5e9",
                        "primary-hover": "#0284c7",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                    }
                },
            },
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.3); border-radius: 20px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); }
        textarea::-webkit-scrollbar { display: none; }
        textarea { -ms-overflow-style: none; scrollbar-width: none; }
        .text-gradient { background: linear-gradient(135deg, #0ea5e9, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .chat-bubble-user { background-color: #e0f2fe; color: #0f172a; border-radius: 1.5rem 1.5rem 0 1.5rem; }
        .dark .chat-bubble-user { background-color: #334155; color: #f8fafc; }
        .chat-bubble-ai { background-color: transparent; color: inherit; }
        .fade-enter { opacity: 0; transform: translateY(10px); animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .typing-indicator span { display: inline-block; width: 6px; height: 6px; background-color: #9ca3af; border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .prose pre { position: relative; padding: 0; background: transparent; margin-top: 0.5rem; margin-bottom: 0.5rem; border-radius: 0.5rem; overflow: hidden; }
        .prose pre code { display: block; padding: 1rem; overflow-x: auto; font-family: monospace; font-size: 0.9em; background-color: #1e293b; color: #f8fafc; }
        .prose code { font-family: monospace; background-color: rgba(156, 163, 175, 0.2); padding: 0.1rem 0.3rem; border-radius: 0.25rem; color: #0ea5e9; }
        .prose p { margin-bottom: 0.75rem; }
        .prose a { color: #0ea5e9; text-decoration: none; font-weight: 500; }
        .prose a:hover { text-decoration: underline; }
        .prose ul, .prose ol { padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .prose ul { list-style-type: disc; }
        .prose ol { list-style-type: decimal; }
        .msg-actions { opacity: 0; transition: opacity 0.2s; }
        .message-row:hover .msg-actions { opacity: 1; }
        @media (max-width: 768px) { .msg-actions { opacity: 1; } } /* Always show on mobile */
        .code-copy-btn { position: absolute; top: 8px; right: 8px; background: rgba(255, 255, 255, 0.15); color: white; border: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; z-index: 5; opacity: 0; transition: opacity 0.2s; backdrop-filter: blur(4px); pointer-events: auto; }
        pre:hover .code-copy-btn { opacity: 1; }
        @keyframes blink-cursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .streaming-cursor::after { content: '▎'; animation: blink-cursor 1s infinite; color: #0ea5e9; font-weight: bold; margin-left: 1px; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 h-screen overflow-hidden flex selection:bg-primary/20 transition-colors duration-300">

    <div id="loading" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-white dark:bg-[#0f172a] transition-opacity duration-500">
        <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-slate-600 dark:text-slate-300 font-medium">Starting GSCA AI...</p>
    </div>

    <div id="app" class="hidden flex-1 flex w-full h-full relative">
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-[280px] h-full bg-[#f1f5f9] dark:bg-[#0b1120] flex flex-col justify-between transform -translate-x-full md:translate-x-0 transition-transform duration-300 shrink-0 border-r border-slate-200 dark:border-slate-800 md:border-none">
            <div class="p-3 flex flex-col gap-6 h-[calc(100%-220px)]">
                <div class="px-2 pt-2 flex items-center justify-between">
                    <button id="close-sidebar-btn" class="md:hidden p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300">
                        <span class="material-symbols-outlined">menu_open</span>
                    </button>
                    <div class="hidden md:flex p-2 text-slate-800 dark:text-slate-200 items-center gap-2">
                        <div class="size-8 rounded-xl bg-gradient-to-tr from-primary to-blue-600 shrink-0 flex items-center justify-center text-white shadow-md">
                            <span class="material-symbols-outlined text-[20px]">psychology</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="font-bold text-sm tracking-wide leading-tight">GSCA AI</span>
                            <span class="text-[10px] text-slate-500">App Interface</span>
                        </div>
                    </div>
                </div>

                <button id="new-chat-btn" class="flex items-center gap-3 bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 px-4 py-3 rounded-xl hover:border-primary dark:hover:border-primary transition-all w-full shadow-sm group">
                    <span class="material-symbols-outlined text-primary group-hover:rotate-90 transition-transform" style="font-size: 20px;">add</span>
                    <span class="text-sm font-medium">New Conversation</span>
                </button>

                <div class="flex flex-col gap-2 mt-2 flex-1 overflow-hidden">
                    <div class="px-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Chat History</div>
                    <div id="chat-list" class="custom-scrollbar overflow-y-auto flex-1 flex flex-col gap-1 pr-2 pb-4"></div>
                </div>
            </div>

            <div class="p-3 flex flex-col gap-1 border-t border-slate-200 dark:border-slate-800 md:border-none">
                <button id="export-chat-btn" class="flex items-center gap-3 px-3 py-2.5 mb-1 rounded-xl hover:bg-blue-50 dark:hover:bg-blue-900/20 text-blue-600 dark:text-blue-400 text-sm font-medium transition-colors">
                    <span class="material-symbols-outlined text-xl">download</span> Export Chat
                </button>
                <button id="clear-current-chat-btn" class="flex items-center gap-3 px-3 py-2.5 mb-1 rounded-xl hover:bg-orange-50 dark:hover:bg-orange-900/20 text-orange-600 dark:text-orange-400 text-sm font-medium transition-colors">
                    <span class="material-symbols-outlined text-xl">clear_all</span> Clear Current Chat
                </button>
                <button id="clear-data-btn" class="flex items-center gap-3 px-3 py-2.5 mb-1 rounded-xl hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600 dark:text-red-400 text-sm font-medium transition-colors">
                    <span class="material-symbols-outlined text-xl">delete_sweep</span> Clear All Data
                </button>
                <button id="open-settings-btn" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-sm font-medium transition-colors">
                    <span class="material-symbols-outlined text-xl">tune</span> AI Settings
                </button>
                <div class="flex items-center justify-between px-3 py-2 mt-2 bg-white dark:bg-[#1e293b] rounded-lg border border-slate-200 dark:border-slate-700">
                    <div class="flex items-center gap-2">
                        <div class="size-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)] animate-pulse"></div>
                        <span id="current-model-display" class="text-xs font-medium text-slate-600 dark:text-slate-300 truncate max-w-[120px]">deepseek/deepseek-chat</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full relative bg-surface-light dark:bg-background-dark md:rounded-l-[2rem] border-l border-slate-200 dark:border-slate-800 shadow-xl overflow-hidden w-full">
            <div class="md:hidden flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-800 bg-surface-light/80 dark:bg-background-dark/80 backdrop-blur-md z-20">
                <button id="open-sidebar-btn" class="p-2 -ml-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <h1 class="text-base font-semibold text-slate-800 dark:text-white flex items-center gap-2">
                    <div class="size-6 rounded-md bg-gradient-to-tr from-primary to-blue-600 flex items-center justify-center text-white">
                        <span class="material-symbols-outlined text-[14px]">psychology</span>
                    </div>
                    GSCA AI
                </h1>
                <button id="theme-toggle-mobile" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300">
                    <span class="material-symbols-outlined theme-icon-mob">dark_mode</span>
                </button>
            </div>

            <div class="absolute top-4 right-6 flex items-center gap-3 z-20 hidden md:flex">
                <button id="theme-toggle" class="flex items-center justify-center p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors bg-white dark:bg-[#1e293b] shadow-sm border border-slate-200 dark:border-slate-700" title="Toggle Theme">
                    <span id="theme-icon" class="material-symbols-outlined text-lg">dark_mode</span>
                </button>
            </div>

            <div id="chat-container" class="flex-1 overflow-y-auto custom-scrollbar flex flex-col items-center pt-6 md:pt-10 pb-40 px-4 md:px-0 w-full scroll-smooth">
                <div id="welcome-screen" class="w-full max-w-[800px] flex flex-col gap-8 mt-4 md:mt-12 fade-enter">
                    <div class="text-center space-y-3">
                        <div class="inline-flex items-center justify-center p-4 rounded-2xl bg-blue-50 dark:bg-blue-900/20 text-primary mb-2">
                            <span class="material-symbols-outlined text-5xl">psychology</span>
                        </div>
                        <h1 class="text-3xl md:text-5xl font-bold tracking-tight text-slate-800 dark:text-white">
                            GSCA AI
                        </h1>
                        <h2 class="text-xl md:text-2xl font-medium text-slate-500 dark:text-slate-400">
                            Smart Assistant. <span class="text-gradient">How can I help you?</span>
                        </h2>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full mt-6 px-2 md:px-0">
                        <button class="prompt-btn flex items-center gap-4 p-4 rounded-2xl bg-white dark:bg-[#1e293b] hover:shadow-md transition-all text-left border border-slate-200 dark:border-slate-700 group">
                            <div class="p-3 rounded-xl bg-blue-50 dark:bg-blue-500/10 text-blue-500 group-hover:scale-110 transition-transform"><span class="material-symbols-outlined">calculate</span></div>
                            <div class="flex-1">
                                <h3 class="font-semibold text-slate-800 dark:text-slate-200 text-sm">Solve Complex Math</h3>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Help me understand algebra or calculus</p>
                            </div>
                        </button>
                        <button class="prompt-btn flex items-center gap-4 p-4 rounded-2xl bg-white dark:bg-[#1e293b] hover:shadow-md transition-all text-left border border-slate-200 dark:border-slate-700 group">
                            <div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-500/10 text-emerald-500 group-hover:scale-110 transition-transform"><span class="material-symbols-outlined">code_blocks</span></div>
                            <div class="flex-1">
                                <h3 class="font-semibold text-slate-800 dark:text-slate-200 text-sm">Web Development Setup</h3>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Write HTML/JS/CSS for a new project</p>
                            </div>
                        </button>
                        <button class="prompt-btn flex items-center gap-4 p-4 rounded-2xl bg-white dark:bg-[#1e293b] hover:shadow-md transition-all text-left border border-slate-200 dark:border-slate-700 group">
                            <div class="p-3 rounded-xl bg-purple-50 dark:bg-purple-500/10 text-purple-500 group-hover:scale-110 transition-transform"><span class="material-symbols-outlined">description</span></div>
                            <div class="flex-1">
                                <h3 class="font-semibold text-slate-800 dark:text-slate-200 text-sm">Analyze Documents</h3>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Upload a .txt or .csv and ask questions</p>
                            </div>
                        </button>
                        <button class="prompt-btn flex items-center gap-4 p-4 rounded-2xl bg-white dark:bg-[#1e293b] hover:shadow-md transition-all text-left border border-slate-200 dark:border-slate-700 group">
                            <div class="p-3 rounded-xl bg-orange-50 dark:bg-orange-500/10 text-orange-500 group-hover:scale-110 transition-transform"><span class="material-symbols-outlined">translate</span></div>
                            <div class="flex-1">
                                <h3 class="font-semibold text-slate-800 dark:text-slate-200 text-sm">Language Translation</h3>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Translate English text to perfect Bengali</p>
                            </div>
                        </button>
                    </div>
                </div>

                <div id="messages-container" class="w-full max-w-[800px] flex flex-col gap-6 px-2 md:px-0 hidden pb-10"></div>

                <div id="typing-indicator" class="w-full max-w-[800px] px-2 md:px-0 hidden mt-4">
                    <div class="flex gap-4">
                        <div class="size-8 rounded-xl bg-primary flex items-center justify-center shrink-0 mt-1 shadow-md">
                            <span class="material-symbols-outlined text-white text-[18px]">smart_toy</span>
                        </div>
                        <div class="flex flex-col gap-2 justify-center bg-white dark:bg-[#1e293b] px-5 py-4 rounded-2xl rounded-tl-none border border-slate-100 dark:border-slate-800 shadow-sm">
                            <div class="typing-indicator flex gap-1.5">
                                <span></span><span></span><span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-surface-light via-surface-light to-transparent dark:from-background-dark dark:via-background-dark pt-12 pb-6 px-4 z-20">
                <div class="max-w-[800px] mx-auto relative">
                    <div id="status-banner" class="hidden absolute -top-14 left-0 right-0 px-4 py-2.5 rounded-xl text-sm text-center shadow-lg font-medium transition-all duration-300"></div>

                    <div id="upload-preview-container" class="hidden absolute -top-24 left-4 bg-white dark:bg-[#1e293b] p-2 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 flex items-center gap-3">
                        <div class="relative group flex items-center">
                            <img id="image-preview" src="" class="h-16 w-16 object-cover rounded-lg hidden" alt="Upload preview">
                            <div id="file-preview-icon" class="h-16 w-16 bg-slate-100 dark:bg-slate-800 rounded-lg hidden flex flex-col items-center justify-center text-primary">
                                <span class="material-symbols-outlined text-2xl">description</span>
                                <span id="file-preview-ext" class="text-[10px] font-bold mt-1 uppercase">TXT</span>
                            </div>
                            <button id="remove-upload-btn" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity shadow-sm">
                                <span class="material-symbols-outlined text-[14px]">close</span>
                            </button>
                        </div>
                        <div id="file-preview-name" class="text-xs font-medium text-slate-600 dark:text-slate-300 max-w-[150px] truncate hidden"></div>
                    </div>

                    <div class="bg-white dark:bg-[#1e293b] rounded-3xl pl-3 pr-2 py-2 flex items-end gap-2 focus-within:ring-2 focus-within:ring-primary/50 transition-all border border-slate-200 dark:border-slate-700 shadow-xl">

                        <input type="file" id="file-upload" accept="image/*,.txt,.csv,.json,.md,.html,.css,.js" class="hidden">
                        <button onclick="document.getElementById('file-upload').click()" class="p-2.5 mb-1 rounded-full text-slate-500 hover:text-primary dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors shrink-0" title="Upload File/Image">
                            <span class="material-symbols-outlined text-[22px]">attach_file</span>
                        </button>

                        <button id="voice-btn" class="p-2.5 mb-1 rounded-full text-slate-500 hover:text-red-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors shrink-0" title="Voice Input">
                            <span class="material-symbols-outlined text-[22px]" id="mic-icon">mic</span>
                        </button>

                        <textarea id="user-input" class="w-full bg-transparent border-none focus:ring-0 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 resize-none py-3 px-2 max-h-[200px] text-base leading-relaxed focus:outline-none" placeholder="Ask anything... (Shift+Enter for new line)" rows="1" style="min-height: 50px;"></textarea>

                        <div class="flex items-center mb-1 shrink-0 gap-1">
                            <button id="stop-btn" class="hidden p-3 rounded-full text-slate-700 dark:text-slate-200 bg-slate-200 dark:bg-slate-700 hover:bg-red-500 hover:text-white transition-colors" title="Stop Generation">
                                <span class="material-symbols-outlined text-[20px]">stop</span>
                            </button>
                            <button id="send-btn" class="p-3 rounded-full text-white bg-primary hover:bg-primary-hover transition-colors disabled:opacity-50 disabled:bg-slate-300 dark:disabled:bg-slate-700 shadow-md flex items-center justify-center group">
                                <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform">send</span>
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-3 flex justify-center items-center gap-2">
                        <p class="text-[10px] md:text-xs text-slate-400 dark:text-slate-500 font-medium">
                            Powered by OpenRouter API • GSCA App Interface
                        </p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="settings-modal" class="fixed inset-0 z-[99999] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 px-4">
        <div class="bg-white dark:bg-[#0f172a] w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800 transform scale-95 transition-transform duration-300" id="settings-content">
            <div class="px-6 py-5 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-[#1e293b]">
                <h3 class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">tune</span> GSCA Settings
                </h3>
                <button id="close-settings-btn" class="p-1.5 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-red-100 hover:text-red-600 transition-colors">
                    <span class="material-symbols-outlined text-sm">close</span>
                </button>
            </div>

            <div class="p-6 flex flex-col gap-6 max-h-[70vh] overflow-y-auto custom-scrollbar">
                
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Voice Recognition Language</label>
                    <div class="relative">
                        <select id="recog-lang-input" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-[#1e293b] text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary pl-10 py-3 appearance-none font-medium">
                            <option value="">Auto-Detect (Browser Default)</option>
                            <option value="bn-BD">Bengali (বাংলাদেশ)</option>
                            <option value="en-US">English (US)</option>
                            <option value="hi-IN">Hindi (भारत)</option>
                            <option value="ar-SA">Arabic (العربية)</option>
                        </select>
                        <span class="material-symbols-outlined absolute left-3 top-3.5 text-slate-400 text-[20px]">language</span>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Select Chat Model</label>
                    <div class="relative">

                            els.uploadPreviewContainer.classList.remove('hidden');
                        };
                        reader.readAsDataURL(file);
                    } else {
                        // Read as text
                        const ext = file.name.split('.').pop().substring(0,4);
                        els.filePreviewExt.textContent = ext;
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            state.currentFileText = `\n\n[File Content: ${file.name}]\n\`\`\`\n${ev.target.result}\n\`\`\`\n`;
                            state.currentImageBase64 = null;
                            els.imagePreview.classList.add('hidden');
                            els.filePreviewIcon.classList.remove('hidden');
                            els.uploadPreviewContainer.classList.remove('hidden');
                        };
                        reader.readAsText(file);
                    }
                }
            });

            els.removeUploadBtn.addEventListener('click', () => {
                state.currentImageBase64 = null;
                state.currentFileText = null;
                els.uploadPreviewContainer.classList.add('hidden');
                els.fileUpload.value = '';
            });

            // Speech Recognition Setup (Any Language)
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = true;
                
                recognition.onstart = () => {
                    els.micIcon.classList.add('text-red-500', 'animate-pulse');
                    els.userInput.placeholder = "Listening... Speak now";
                };
                recognition.onresult = (event) => {
                    els.userInput.value = Array.from(event.results).map(r => r[0].transcript).join('');
                };
                recognition.onend = () => {
                    els.micIcon.classList.remove('text-red-500', 'animate-pulse');
                    els.userInput.placeholder = "Ask anything... (Shift+Enter for new line)";
                };
                els.voiceBtn.addEventListener('click', () => {
                    if (els.micIcon.classList.contains('animate-pulse')) {
                        recognition.stop();
                    } else {
                        // Dynamically set language based on settings or let browser auto-detect
                        if(state.recogLang) { recognition.lang = state.recogLang; } 
                        else { recognition.lang = ''; }
                        recognition.start();
                    }
                });
            } else {
                els.voiceBtn.style.display = 'none';
            }

            window.speakText = (text) => {
                const synth = window.speechSynthesis;
                if (synth.speaking) { synth.cancel(); return; }
                const cleanText = text.replace(/[*#`_~>]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                if (state.voiceURI && state.voiceURI !== 'default') {
                    const selectedVoice = availableVoices.find(v => v.voiceURI === state.voiceURI);
                    if (selectedVoice) utterance.voice = selectedVoice;
                }
                utterance.rate = 1.0; utterance.pitch = 1.0;
                synth.speak(utterance);
                showStatus('Playing audio...', 'success');
            };

            function fallbackCopy(text, btn) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                document.body.appendChild(textarea);
                textarea.select();
                try { document.execCommand('copy'); if(btn) btn.innerHTML = 'Copied!'; } 
                catch (err) {}
                document.body.removeChild(textarea);
            }

            window.addCodeCopyButtons = (container) => {
                if (!container) return;
                const pres = container.querySelectorAll('pre');
                pres.forEach(pre => {
                    if (pre.querySelector('.code-copy-btn')) return;
                    const btn = document.createElement('button');
                    btn.className = 'code-copy-btn';
                    btn.innerHTML = '<span class="material-symbols-outlined text-[14px]">content_copy</span> Copy';
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation(); e.preventDefault();
                        const code = pre.querySelector('code')?.innerText || '';
                        if (navigator.clipboard && window.isSecureContext) {
                            navigator.clipboard.writeText(code).then(() => { btn.innerHTML = 'Copied!'; setTimeout(() => btn.innerHTML = 'Copy', 2000); }).catch(() => fallbackCopy(code, btn));
                        } else { fallbackCopy(code, btn); }
                    });
                    pre.style.position = 'relative'; pre.appendChild(btn);
                });
            };

            els.userInput.addEventListener('input', function() {
                this.style.height = '50px';
                this.style.height = (this.scrollHeight) + 'px';
                els.sendBtn.disabled = this.value.trim().length === 0 && !state.currentImageBase64 && !state.currentFileText;
            });

            const renderMessage = (msgObj) => {
                const wrapper = document.createElement('div');
                wrapper.className = `flex w-full message-row group ${msgObj.role === 'user' ? 'justify-end' : 'justify-start'}`;
                wrapper.id = `msg-${msgObj.id}`;
                let contentHtml = '';
                
                if (msgObj.role === 'user') {
                    const safeText = DOMPurify.sanitize(msgObj.content.text);
                    contentHtml = `<div class="chat-bubble-user px-5 py-3 max-w-[85%] shadow-sm text-[15px] leading-relaxed relative border border-slate-100 dark:border-slate-700">
                        ${msgObj.content.image ? `<img src="${msgObj.content.image}" class="max-w-[200px] rounded-lg mb-2 border border-slate-200 dark:border-slate-700">` : ''}
                        <div class="whitespace-pre-wrap font-medium">${safeText}</div>
                    </div>`;
                } else {
                    const parsedMarkdown = marked.parse(msgObj.content.text);
                    const safeMarkdown = DOMPurify.sanitize(parsedMarkdown);
                    contentHtml = `
                    <div class="flex gap-4 w-full max-w-full">
                        <div class="size-8 rounded-xl bg-gradient-to-tr from-primary to-blue-600 shrink-0 mt-1 flex items-center justify-center text-white shadow-md">
                            <span class="material-symbols-outlined text-[18px]">psychology</span>
                        </div>
                        <div class="flex flex-col gap-1 w-full overflow-hidden">
                            <div class="font-bold text-sm text-slate-800 dark:text-slate-200">GSCA AI</div>
                            <div class="prose dark:prose-invert max-w-none text-[15px] leading-relaxed chat-bubble-ai">${safeMarkdown}</div>
                            <div class="msg-actions flex items-center gap-2 mt-2">
                                <button onclick="copyText('${msgObj.id}')" class="flex items-center gap-1 px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 hover:text-primary text-slate-500 text-xs font-semibold transition" title="Copy"><span class="material-symbols-outlined text-[14px]">content_copy</span> Copy</button>
                                <button onclick="speakText(document.getElementById('msg-${msgObj.id}').querySelector('.prose').innerText)" class="flex items-center gap-1 px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 hover:text-green-500 text-slate-500 text-xs font-semibold transition" title="Read Aloud"><span class="material-symbols-outlined text-[14px]">volume_up</span> Speak</button>
                            </div>
                        </div>
                    </div>`;
                }
                wrapper.innerHTML = contentHtml;
                els.messagesContainer.appendChild(wrapper);
                if (msgObj.role === 'assistant') {
                    addCodeCopyButtons(wrapper);
                    wrapper.querySelectorAll('pre code').forEach(block => { try { hljs.highlightElement(block); } catch (e) {} });
                }
                scrollToBottom();
            };

            const createAssistantMessageShell = (msgObj) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex w-full message-row group justify-start';
                wrapper.id = `msg-${msgObj.id}`;
                wrapper.innerHTML = `
                    <div class="flex gap-4 w-full max-w-full">
                        <div class="size-8 rounded-xl bg-gradient-to-tr from-primary to-blue-600 shrink-0 mt-1 flex items-center justify-center text-white shadow-md"><span class="material-symbols-outlined text-[18px]">psychology</span></div>
                        <div class="flex flex-col gap-1 w-full overflow-hidden">
                            <div class="font-bold text-sm text-slate-800 dark:text-slate-200">GSCA AI</div>
                            <div class="prose dark:prose-invert max-w-none text-[15px] leading-relaxed chat-bubble-ai streaming-cursor"></div>
                        </div>
                    </div>`;
                els.messagesContainer.appendChild(wrapper);
                return wrapper;
            };

            window.copyText = (id) => {
                const proseEl = document.querySelector(`#msg-${id} .prose`);
                if (!proseEl) return;
                const text = proseEl.innerText;
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(() => showStatus('Text Copied!', 'success')).catch(() => fallbackCopy(text, null));
                } else { fallbackCopy(text, null); }
            };

            const enhanceWithMemory = () => {
                const apiMessages = [{ role: "system", content: state.systemPrompt }];
                const recentMessages = state.messages.slice(-8);
                recentMessages.forEach(msg => {
                    if (msg.content.image) {
                        apiMessages.push({ role: msg.role, content: [ { type: "text", text: msg.content.text || "Image context" }, { type: "image_url", image_url: { url: msg.content.image } } ] });
                    } else {
                        apiMessages.push({ role: msg.role, content: msg.content.text });
                    }
                });
                return apiMessages;
            };

            const generateAIResponse = async () => {
                els.typingIndicator.classList.add('hidden');
                els.stopBtn.classList.remove('hidden');
                els.sendBtn.parentElement.classList.add('hidden');
                state.isGenerating = true;

                const aiMsgId = generateId();
                const aiMsg = { id: aiMsgId, role: 'assistant', content: { text: '' }, timestamp: Date.now() };
                state.messages.push(aiMsg);

                const wrapper = createAssistantMessageShell(aiMsg);
                const proseEl = wrapper.querySelector('.prose');
                let fullContent = '';
                state.abortController = new AbortController();
                
                // API Rotation Logic
                let retryCount = 0;
                let success = false;

                while (retryCount < _kData.length && !success) {
                    const activeKey = atob(_kData[_currentKeyIndex]);
                    
                    try {
                        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                            method: "POST",
                            headers: { "Authorization": `Bearer ${activeKey}`, "HTTP-Referer": window.location.href, "X-Title": "GSCA AI APP", "Content-Type": "application/json" },
                            body: JSON.stringify({ model: state.model, messages: enhanceWithMemory(), stream: true }),
                            signal: state.abortController.signal
                        });

                        if (response.status === 401 || response.status === 402 || response.status === 429) {
                            // Key exhausted or rate limited. Rotate key.
                            console.warn("API Key Exhausted. Rotating...");
                            _currentKeyIndex = (_currentKeyIndex + 1) % _kData.length;
                            localStorage.setItem('gsca_key_idx', _currentKeyIndex);
                            retryCount++;
                            continue; // Try again
                        }

                        if (!response.ok) throw new Error("API Request Failed");

                        success = true; // We connected!
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop() || '';
                            for (const line of lines) {
                                const trimmed = line.trim();
                                if (!trimmed.startsWith('data: ')) continue;
                                const data = trimmed.slice(6);
                                if (data === '[DONE]') break;
                                try {
                                    const json = JSON.parse(data);
                                    const delta = json.choices?.[0]?.delta?.content || '';
                                    if (delta) {
                                        fullContent += delta;
                                        proseEl.innerHTML = DOMPurify.sanitize(marked.parse(fullContent));
                                        proseEl.classList.add('streaming-cursor');
                                        scrollToBottom();
                                    }
                                } catch (e) {}
                            }
                        }
                    } catch (error) {
                        if (error.name === 'AbortError') { showStatus('Generation Stopped', 'success'); break; } 
                        else if (!success && retryCount >= _kData.length - 1) {
                            showStatus(`Error: All API keys exhausted or network error.`, 'error');
                            proseEl.innerHTML = `<span class="text-red-500">Failed to connect after rotating keys.</span>`;
                            break;
                        }
                    }
                }

                proseEl.classList.remove('streaming-cursor');
                aiMsg.content.text = fullContent || proseEl.innerText;
                addCodeCopyButtons(wrapper);
                wrapper.querySelectorAll('pre code').forEach(block => { try { hljs.highlightElement(block); } catch (e) {} });
                saveCurrentSession();
                els.stopBtn.classList.add('hidden');
                els.sendBtn.parentElement.classList.remove('hidden');
                state.isGenerating = false;
                state.abortController = null;
                scrollToBottom();
            };

            const handleSend = async () => {
                let text = els.userInput.value.trim();
                const image = state.currentImageBase64;
                const fileTxt = state.currentFileText;

                if (!text && !image && !fileTxt) return;
                
                if (fileTxt) { text = text + fileTxt; }

                els.welcomeScreen.classList.add('hidden');
                els.messagesContainer.classList.remove('hidden');
                els.userInput.value = '';
                els.userInput.style.height = '50px';
                els.sendBtn.disabled = true;
                els.removeUploadBtn.click();

                const userMsg = { id: generateId(), role: 'user', content: { text, image }, timestamp: Date.now() };
                state.messages.push(userMsg);
                renderMessage(userMsg);
                saveCurrentSession();

                generateAIResponse();
            };

            els.sendBtn.addEventListener('click', handleSend);
            els.userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!els.sendBtn.disabled) handleSend(); }
            });
            els.stopBtn.addEventListener('click', () => { if (state.abortController) state.abortController.abort(); });
            els.promptBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    els.userInput.value = btn.querySelector('p').innerText;
                    els.sendBtn.disabled = false; handleSend();
                });
            });
            els.newChatBtn.addEventListener('click', () => {
                state.currentChatId = generateId(); state.messages = [];
                els.messagesContainer.innerHTML = ''; els.messagesContainer.classList.add('hidden');
                els.welcomeScreen.classList.remove('hidden'); renderHistory();
                if (window.innerWidth < 768) toggleSidebar();
            });
        });
    </script>
</body>
</html>
